# clay-sensor-monitor configuration
# Real entities verified against Home Assistant on 2026-10-21.
# Thresholds chosen from observed baselines; tune as needed.

sensors:
  # ---- Storage / infrastructure (highest value) ----

  # NVR recording storage (UniFi Protect Video Recorder Pro).
  # NOTE: this sensor's value is stuck at 99.55% and has not updated since
  # 2026-10-18, so it is NOT a reliable health signal on its own — the NVR
  # runs near-full by design with rolling retention. Threshold is set very
  # high purely as a tripwire; the real signal is recording_capacity below.
  - entity: sensor.video_recorder_pro_storage_utilization
    name: NVR Storage
    threshold:
      direction: above
      value: 99.9
    message: "NVR recording storage is at {value}% full. Old footage will start rotating."
    actions:
      - type: notify
        title: "💾 NVR Storage Alert"
        message: "NVR storage at {value}% — recordings will roll off soon."
      - type: tts
        speaker: office
        urgency: normal
        message: "NVR storage alert. Recording storage is at {value} percent full."

  # Recording capacity in seconds. 2046718s ≈ 23.7 days of footage retained.
  # This is the real NVR health signal — alert when retention drops below 7 days.
  - entity: sensor.video_recorder_pro_recording_capacity
    name: NVR Recording Buffer
    threshold:
      direction: below
      value: 604800
    message: "NVR recording retention is down to {value} seconds ({unit}). Footage will roll off soon."
    actions:
      - type: notify
        title: "⏳ NVR Recording Retention Low"
        message: "Recording retention at {value}s remaining."
      - type: tts
        speaker: office
        urgency: normal
        message: "NVR recording alert. Only {value} seconds of footage remain."

  # ---- Network / device health ----

  # PoE switch core temperature (ran ~125F on 2026-10-21)
  - entity: sensor.switch_pro_max_24_poe_temperature
    name: PoE Switch Temp
    threshold:
      direction: above
      value: 140
    message: "The PoE switch is running hot at {value} degrees."
    actions:
      - type: notify
        title: "🔥 PoE Switch Hot"
        message: "PoE switch at {value}°F."

  # ---- Sensor battery / device health ----

  # Count of devices reporting low battery
  - entity: sensor.low_battery_count
    name: Low Battery Devices
    threshold:
      direction: above
      value: 0
    message: "{value} devices are reporting low battery."
    actions:
      - type: notify
        title: "🔋 Low Battery"
        message: "{value} device(s) reporting low battery."

  # ---- Environment (device temps where no dedicated climate sensor exists) ----

  - entity: sensor.0x00158d0009f5f390_device_temperature
    name: Contact Sensor Temp
    threshold:
      direction: above
      value: 120
    message: "Contact sensor is running hot at {value} degrees."
    actions:
      - type: notify
        title: "🔥 Sensor Overheating"
        message: "Contact sensor device at {value}°F."

  - entity: sensor.motion_basement_stairs_device_temperature
    name: Basement Stairs Motion Temp
    threshold:
      direction: above
      value: 120
    message: "Basement stairs motion sensor is at {value} degrees."
    actions:
      - type: notify
        title: "🔥 Basement Sensor Hot"
        message: "Basement stairs motion sensor at {value}°F."

  # ---- Doors / access ----

  # contact sensor: on == open. Alerts once per open cycle (rising edge).
  - entity: binary_sensor.garage_man_door_contact
    name: Garage Man Door
    threshold:
      direction: above
      value: 0
    message: "The garage man door has been opened."
    actions:
      - type: notify
        title: "🚪 Garage Door Opened"
        message: "Garage man door opened."

# Polling interval (seconds)
interval: 300
